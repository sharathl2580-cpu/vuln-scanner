[metadata]
name = vuln-scanner
version = 0.3.0
author = Your Name
description = CLI tool to scan project dependencies, secrets, and code patterns for security issues.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.9
install_requires =
    requests>=2.32.5

[options.extras_require]
dev =
    pytest>=7.0

[options.entry_points]
console_scripts =
    vuln-scanner = vuln_scanner.scan:main
